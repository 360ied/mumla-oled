// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Migration Slice 0: version catalog (gradle/libs.versions.toml) is the single
// source of truth for modern-stack pins. Plugins are declared here with
// `apply false`; modules apply them without versions.
// AGP 9 built-in Kotlin: no kotlin-android plugin (AGP provides it); KGP
// version rides the buildscript classpath below (2.4.21, higher than AGP's
// bundled 2.2.10). kapt runs under AGP's legacy-kapt (kotlin-kapt is
// incompatible with built-in Kotlin) until the KSP 2.4 TODO lands.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Single source of truth stays gradle/libs.versions.toml ([versions]
        // kotlin); catalog accessors don't reach the buildscript block.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21")
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.legacy.kapt) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.paparazzi) apply false
}

// Shared javac lint for all modules (hoisted: an `allprojects` block inside a
// child build file applies only to itself, so this lives at the root).
allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann" << "-Xlint:-this-escape"
    }
}
