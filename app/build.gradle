buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

def signingFile = file 'signing.gradle'
if (signingFile.exists()) apply from: signingFile

allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann" << "-Xlint:-this-escape"
    }
}

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    base {
        archivesName = "mumla"
    }

    // gradle8: Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
    }

    def gitDescribeRaw = providers.exec {
        // Need --always because there are no tags in gitlab ci (right?)
        // New tags are v-prefixed (e.g. v0.24.0); also match legacy bare tags.
        commandLine "git", "describe", "--tags", "--match", "v[0-9]*.[0-9]*.[0-9]*", "--match", "[0-9]*.[0-9]*.[0-9]*", "--always"
    }.standardOutput.asText.get().trim()
    // Strip the leading 'v' so versionName/VERSIONTAG stay bare semver.
    def gitDescribe = gitDescribeRaw.replaceFirst(/^v(?=\d)/, "")

    defaultConfig {
        minSdkVersion 21
        targetSdk 36

        applicationId "se.lublin.mumla"
        // Remember: app_news_items_vX_Y_Z in src/main/res/values/strings.xml
        // and NEWS_ITEMS in src/main/res/java/se/lublin/mumla/app/DialogUtils.java
        //     code:XYYZZbb (bb for build)
        versionCode 3070300
        versionName gitDescribe

        buildConfigField "String", "VERSIONTAG", "\"" + gitDescribe.split("-")[0] + "\""

        testInstrumentationRunner "android.test.InstrumentationTestRunner"

        resourceConfigurations += ["en", "fr", "zh-rCN"]

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    flavorDimensions "release"
    productFlavors {
        foss {
            dimension "release"
            applicationId "se.lublin.mumla"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".oled15"
            resValue "string", "app_name", "Mumla OLED"
            if (signingConfigs.hasProperty("release")) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            versionNameSuffix "-debug"
            applicationIdSuffix ".oled15"
            resValue "string", "app_name", "Mumla OLED"
        }
    }
    lint {
        abortOnError = true
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
    applicationVariants.all { variant ->
        variant.resValue "string", "search_suggest_authority", "${variant.applicationId}.channel.ChannelSearchProvider"
    }

    packaging {
        resources {
            excludes += [
                'google/protobuf/**',
                '**/*.proto',
                'META-INF/CHANGES',
                'META-INF/README.md'
            ]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

// Fail closed at execution time when an app release assemble/bundle/package/install
// runs without app/signing.gradle (which would otherwise fall back to debug signing). This MUST stay inside taskGraph.whenReady: a
// configuration-time throw would break every build (including debug/CI)
// on machines without the intentionally uncommitted local signing file.
// Debug builds never enter this branch and are unaffected.
gradle.taskGraph.whenReady { graph ->
    def wantsReleaseAssemble = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package|install).*Release/ }
    def hasReleaseSigning = android.signingConfigs.hasProperty("release")
    if (wantsReleaseAssemble && !hasReleaseSigning) {
        throw new GradleException('Release build requires app/signing.gradle defining signingConfigs.release (local file, intentionally uncommitted). Debug builds are unaffected.')
    }
}

dependencies {
    implementation project(":libraries:humla")
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    testImplementation 'junit:junit:4.13.2'
    // Robolectric pilot for the comment-dialog fragment tests; pinned: verify @Config(sdk) support before bumping.
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
