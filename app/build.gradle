// Migration Slice 0: plugins resolve via the version catalog (gradle/libs.versions.toml).
// AGP 9 built-in Kotlin provides the kotlin-android plugin (no alias) and the
// `kotlin { compilerOptions }` extension; kapt runs under legacy-kapt.
// TODO: migrate kapt -> KSP when stable KSP for Kotlin 2.4 is published.
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.legacy.kapt)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.hilt)
}

// Paparazzi opt-in (-PwithPaparazzi): applying the plugin unconditionally
// pollutes the unit-test classpath (layoutlib android.* shadows the mockable
// android.jar, breaking stub-dependent tests like ChannelFragmentDensityTest).
// Default off so check.sh stays green; slice-6 goldens run with the flag plus
// a --tests filter for Paparazzi tests only.
if (project.hasProperty("withPaparazzi")) {
    apply plugin: "app.cash.paparazzi"
}

repositories {
    mavenCentral()
    google()
}

def signingFile = file 'signing.gradle'
if (signingFile.exists()) apply from: signingFile

// Shared with both build types so debug and release stay on the same
// application ID and display name.
def oledApplicationIdSuffix = ".oled15"
def oledAppName = "Mumla OLED"

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            // Match the Java toolchain: without this Kotlin defaults to 1.8 bytecode.
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }

    base {
        archivesName = "mumla"
    }

    // gradle8: Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
        // AGP 9 defaults resValues off; this project uses resValue below.
        resValues = true
    }

    def gitDescribeRaw = providers.exec {
        // Need --always because there are no tags in gitlab ci (right?)
        // New tags are v-prefixed (e.g. v0.24.0); also match legacy bare tags.
        commandLine "git", "describe", "--tags", "--match", "v[0-9]*.[0-9]*.[0-9]*", "--match", "[0-9]*.[0-9]*.[0-9]*", "--always"
    }.standardOutput.asText.get().trim()
    // Strip the leading 'v' so versionName/VERSIONTAG stay bare semver.
    def gitDescribe = gitDescribeRaw.replaceFirst(/^v(?=\d)/, "")

    defaultConfig {
        minSdkVersion 30
        targetSdk 36

        applicationId "se.lublin.mumla"
        // Remember: app_news_items_vX_Y_Z in src/main/res/values/strings.xml
        // and NEWS_ITEMS in src/main/res/java/se/lublin/mumla/app/DialogUtils.java
        //     code:XYYZZbb (bb for build)
        versionCode 3070300
        versionName gitDescribe

        buildConfigField "String", "VERSIONTAG", "\"" + gitDescribe.split("-")[0] + "\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resourceConfigurations += ["en", "fr", "zh-rCN"]

        ndk {
            abiFilters.addAll(rootProject.ext.sharedAbiFilters)
        }
    }

    // Single foss flavor retained: removing it would rename every task
    // (assembleFossDebug -> assembleDebug, etc.) and break scripts/check.sh,
    // docs, and CI. The dimension block stays because AGP requires one when
    // productFlavors are present.
    flavorDimensions "release"
    productFlavors {
        foss {
            dimension "release"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix oledApplicationIdSuffix
            resValue "string", "app_name", oledAppName
            if (signingConfigs.hasProperty("release")) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            versionNameSuffix "-debug"
            applicationIdSuffix oledApplicationIdSuffix
            resValue "string", "app_name", oledAppName
        }
    }
    lint {
        abortOnError = true
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
    packaging {
        // Stored-vs-deflated: AGP defaults to uncompressed page-aligned
        // entries when minSdk >= 23 (.so) / >= 28 (dex). minSdk 30 still
        // triggers that, costing ~2.3 MB download size (see
        // docs/apk-size-analysis/README-0.26.0.md §7 #2). Opt back into
        // legacy deflated packaging to minimize the universal FOSS APK;
        // install-time extraction (extractNativeLibs=true) is the trade-off.
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'google/protobuf/**',
                '**/*.proto',
                'META-INF/CHANGES',
                'META-INF/README.md'
            ]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

// Fail closed at execution time when an app release assemble/bundle/package/install
// runs without app/signing.gradle (which would otherwise fall back to debug signing). This MUST stay inside taskGraph.whenReady: a
// configuration-time throw would break every build (including debug/CI)
// on machines without the intentionally uncommitted local signing file.
// Debug builds never enter this branch and are unaffected.
gradle.taskGraph.whenReady { graph ->
    def wantsReleaseAssemble = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package|install).*Release/ }
    def hasReleaseSigning = android.signingConfigs.hasProperty("release")
    if (wantsReleaseAssemble && !hasReleaseSigning) {
        throw new GradleException('Release build requires app/signing.gradle defining signingConfigs.release (local file, intentionally uncommitted). Debug builds are unaffected.')
    }
}

dependencies {
    implementation project(":libraries:humla")
    implementation libs.appcompat
    implementation libs.cardview
    implementation libs.documentfile
    implementation libs.fragment
    implementation libs.recyclerview
    implementation libs.exifinterface
    implementation libs.material
    implementation libs.preference
    implementation libs.media
    implementation libs.jsoup
    // Migration Slice 0 scaffold: Hilt plugin requires the runtime on the classpath.
    // No code uses it yet (first consumer is Slice 2's DatabaseModule/SettingsModule).
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    // Migration Slice 2 data layer: Room + DataStore + coroutines. Room compiler
    // and androidx-hilt compiler run under kapt (no stable KSP for Kotlin 2.4).
    implementation libs.coroutines.core
    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.datastore.preferences
    kapt libs.room.compiler
    kapt libs.androidx.hilt.compiler

    testImplementation libs.junit
    // Robolectric pilot for the comment-dialog fragment tests; pinned: verify @Config(sdk) support before bumping.
    testImplementation libs.robolectric
    // Migration Slice 2: MigrationTestHelper for the v9 -> v10 DB migration test.
    testImplementation libs.room.testing
    // Listener-bridge unit test (TestDispatcher + setMain).
    testImplementation libs.coroutines.test
    // Step-2 live handles: interface fakes in adapter/avatar/talk-key tests.
    testImplementation libs.mockito.core
}
