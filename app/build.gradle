    implementation libs.datastore.preferences
    kapt libs.room.compiler
    kapt libs.androidx.hilt.compiler

    testImplementation 'junit:junit:4.13.2'
    // Robolectric pilot for the comment-dialog fragment tests; pinned: verify @Config(sdk) support before bumping.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    // Migration Slice 2: MigrationTestHelper for the v9 -> v10 DB migration test.
    testImplementation libs.room.testing
    // Listener-bridge unit test (TestDispatcher + setMain).
    testImplementation libs.coroutines.test
}
