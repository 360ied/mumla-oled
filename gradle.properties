android.enableJetifier=false
android.useAndroidX=true
# AGP 9 migration (build/agp9-new-dsl): new DSL + built-in Kotlin adopted per
# the AGP 9.0 upgrade guide (both flags at their AGP 9 defaults, opt-outs
# removed). KGP stays 2.4.21 via the root buildscript classpath (higher than
# AGP's bundled 2.2.10); kapt runs under com.android.legacy-kapt until the
# KSP 2.4 TODO lands.
org.gradle.jvmargs=-Xmx2048m
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
