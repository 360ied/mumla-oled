# Migration Slice 0 scaffold (docs/migration/slices.md).
# Single source of truth for modern-stack pins. Floors are binding, patches float.
# Verified 2026-10-12 at scaffold; re-verify when consuming new artifacts in later slices.
#
# KSP fork (ordered, not open): no stable KSP for Kotlin 2.4 on Maven Central
# at scaffold (latest symbol-processing-api is 2.3.12), so new files use kapt
# with a TODO to migrate when a stable KSP 2.4 line lands.
# TODO: migrate kapt -> KSP when stable KSP for Kotlin 2.4 is published.

[versions]
# AGP 9 adoption (slice 0): AGP 9.0.1 + Gradle 9.1.0 (AGP 9.0 minimums), minimal
# delta from 8.13.2/8.13. Proven by the spike/agp9 worktree (check.sh green +
# assembleFossDebug APK). Outstanding: new-DSL/built-in-Kotlin migration,
# release/R8 verification (deferred to pre-landing).
agp = "9.0.1"
# Kotlin 2.4.21 stands: an early MergeResources failure suspected KGP but
# bisected cleanly to the Paparazzi plugin (see note below) — not to Kotlin.
# If a future failure bisects cleanly to KGP 2.4 (Paparazzi absent), fall back
# to 2.3.21 + KSP 2.3.12.
kotlin = "2.4.21"
# KSP fork (ordered, not open): no stable KSP for Kotlin 2.4 on Maven Central
# at scaffold (latest symbol-processing-api is 2.3.12), so kapt + TODO.
# TODO: migrate kapt -> KSP when stable KSP for Kotlin 2.4 is published.
coroutines = "1.11.0"
compose-bom = "2026.09.00"
navigation-compose = "2.10.2"
activity-compose = "1.13.0"
hilt-navigation-compose = "1.4.0"
lifecycle = "2.11.0"
# Hilt 2.60.1 requires AGP >= 9 (satisfied by the adoption above). NOTE for
# slice 7: re-verify androidx-hilt 1.4.0 against Hilt 2.60 when adding
# hilt-navigation-compose.
hilt = "2.60.1"
androidx-hilt = "1.4.0"
room = "2.8.5"
datastore-preferences = "1.2.1"
# Paparazzi fork (RESOLVED 2026-10-12: disqualified on AGP 8 AND AGP 9,
# deferred to slice 6): on AGP 8 it breaks resource merging build-wide
# (`MergedResourceWriterRequest` NoSuchMethodError); on AGP 9 it configures and
# merges cleanly but breaks the unit-test runtime (ships `android-all` real
# framework classes shadowing the mockable android.jar — same 7 stub-dependent
# failures, all green with the plugin off). The 1.3.x fallback is dead
# (layoutlib caps at compileSdk 35; project is on 36). Pin kept as the slice-6
# re-evaluation starting point (stable 2.0.0 may have moved by then).
paparazzi = "2.0.0-alpha05.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
