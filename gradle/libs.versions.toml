# Migration Slice 0 scaffold (docs/migration/slices.md).
# Single source of truth for modern-stack pins. Floors are binding
# (never depend below the floored version; Dependabot-style bumps must keep
# the floor), patches float (patch bumps need no re-verification).
# Verified 2026-10-12 at scaffold; slices 6+ consumed mockito 5.14.2 and
# coroutines-test doubles without re-verifying the rest — re-verify a pin
# when its artifact is next touched.
#
# KSP fork (ordered, not open): no stable KSP for Kotlin 2.4 on Maven Central
# at scaffold (latest symbol-processing-api is 2.3.12), so annotation processing
# stays on the kapt API — under com.android.legacy-kapt since the AGP 9
# built-in-Kotlin migration (kotlin-kapt plugin is incompatible with it).
# TODO: migrate kapt -> KSP when stable KSP for Kotlin 2.4 is published.

[versions]
# AGP 9 adoption (slice 0): AGP 9.0.1 + Gradle 9.1.0 (AGP 9.0 minimums), minimal
# delta from 8.13.2/8.13. Proven by the spike/agp9 worktree (check.sh green +
# assembleFossDebug APK). New DSL + built-in Kotlin adopted on
# build/agp9-new-dsl (legacy-kapt until KSP 2.4); R8 verified on
# build/r8-release (8.0MB APK + modern-device pass, 2026-10-13).
agp = "9.0.1"
# Kotlin 2.4.21 stands: an early MergeResources failure suspected KGP but
# bisected cleanly to the Paparazzi plugin (see note below) — not to Kotlin.
# If a future failure bisects cleanly to KGP 2.4 (Paparazzi absent), fall back
# to 2.3.21 + KSP 2.3.12.
# With AGP 9 built-in Kotlin, this version rides the root buildscript classpath
# (higher than AGP's bundled KGP 2.2.10) instead of a kotlin-android plugin pin.
kotlin = "2.4.21"
coroutines = "1.11.0"
compose-bom = "2026.09.00"
navigation-compose = "2.10.2"
activity-compose = "1.13.0"
hilt-navigation-compose = "1.4.0"
lifecycle = "2.11.0"
# Hilt 2.60.1 requires AGP >= 9 (satisfied by the adoption above). NOTE for
# slice 7: re-verify androidx-hilt 1.4.0 against Hilt 2.60 when adding
# hilt-navigation-compose.
hilt = "2.60.1"
androidx-hilt = "1.4.0"
room = "2.8.5"
datastore-preferences = "1.2.1"
# Legacy UI / test pins migrated from hardcoded strings in :app and
# :libraries:humla (build/catalog-cleanup). Floors binding, patches float.
appcompat = "1.7.1"
cardview = "1.0.0"
documentfile = "1.1.0"
fragment = "1.8.9"
recyclerview = "1.4.0"
exifinterface = "1.4.2"
material = "1.13.0"
preference = "1.2.1"
media = "1.7.0"
jsoup = "1.23.2"
junit = "4.13.2"
mockito = "5.14.2"
robolectric = "4.15.1"
protobuf = "4.36.2"
annotations = "26.1.0"
minidns = "1.0.5"
collections-immutable = "0.5.2"
# Paparazzi fork (RESOLVED 2026-10-12: disqualified on AGP 8 AND AGP 9,
# deferred to slice 6): on AGP 8 it breaks resource merging build-wide
# (`MergedResourceWriterRequest` NoSuchMethodError); on AGP 9 it configures and
# merges cleanly but breaks the unit-test runtime (ships `android-all` real
# framework classes shadowing the mockable android.jar — same 7 stub-dependent
# failures, all green with the plugin off). The 1.3.x fallback is dead
# (layoutlib caps at compileSdk 35; project is on 36). Pin kept as the slice-6
# re-evaluation starting point (stable 2.0.0 may have moved by then).
paparazzi = "2.0.0-alpha05.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
material = { module = "com.google.android.material:material", version.ref = "material" }
preference = { module = "androidx.preference:preference", version.ref = "preference" }
media = { module = "androidx.media:media", version.ref = "media" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit = { module = "junit:junit", version.ref = "junit" }
# AudioDeviceInfo (route) + AudioHandler.Builder (input-modes) doubles for humla JVM tests.
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections-immutable" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
minidns-hla = { module = "org.minidns:minidns-hla", version.ref = "minidns" }
minidns-android21 = { module = "org.minidns:minidns-android21", version.ref = "minidns" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android pin: AGP 9 built-in Kotlin provides it (KGP version via the
# root buildscript classpath). kotlin-kapt is incompatible with built-in Kotlin;
# kapt runs under AGP's legacy-kapt instead.
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
