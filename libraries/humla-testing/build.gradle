// Shared fakes for the client, session, and app-container tests. They only
// implement public library interfaces, so both modules' unit tests can use
// them without internal access.
plugins {
    alias(libs.plugins.android.library)
}

repositories {
    mavenCentral()
    google()
}

android {
    namespace = 'se.lublin.humla.testing'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }

    defaultConfig {
        minSdkVersion 30
    }
}

dependencies {
    api project(":libraries:humla")
    implementation libs.coroutines.core
    implementation libs.collections.immutable
    implementation libs.protobuf.javalite
}
