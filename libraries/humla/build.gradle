// Migration Slice 0: plugins resolve via the version catalog (gradle/libs.versions.toml).
// AGP 9 built-in Kotlin provides the kotlin-android plugin (no alias) and the
// `kotlin { compilerOptions }` extension; kapt runs under legacy-kapt.
// TODO: migrate kapt -> KSP when stable KSP for Kotlin 2.4 is published.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.legacy.kapt)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.hilt)
}

repositories {
    mavenCentral()
    google()
}

// Single source of truth is gradle/ndk.version (also read by flake.nix).
def humlaNdkVersion = file("$rootDir/gradle/ndk.version").text.trim()

dependencies {
    api libs.protobuf.javalite

    implementation libs.annotations
    implementation libs.minidns.hla
    implementation libs.minidns.android21
    // Migration Slice 0 scaffold: Hilt plugin requires the runtime on the classpath.
    // No code uses it yet.
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    // Migration Slice 4 coroutines service core: LifecycleService base +
    // lifecycleScope is the service scope; ConnectionScope + UDP Channel need
    // coroutines-core. api for lifecycle (public base class); coroutines stays
    // implementation by intent (internal use), though lifecycle-runtime-ktx
    // re-exposes coroutines transitively — the split documents intent, not a
    // sealed classpath.
    api libs.lifecycle.service
    api libs.lifecycle.runtime.ktx
    implementation libs.coroutines.core
    // Migration Slice 5: Server is the Room entity (the @Database lives in
    // :app); the annotations must resolve on this module's classpath too.
    implementation libs.room.runtime
    testImplementation libs.coroutines.test
    testImplementation libs.junit
}

android {
    namespace = 'se.lublin.humla'

    compileSdk = 36
    ndkVersion = humlaNdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            // Match the Java toolchain: without this Kotlin defaults to 1.8 bytecode.
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }

    // Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        testApplicationId "se.lublin.humla.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion 30
        targetSdk 36

        ndk {
            abiFilters.addAll(rootProject.ext.sharedAbiFilters)
        }

        externalNativeBuild {
            cmake {
                // -Wno-deprecated is a CMake CLI flag (not a toolchain define): it
                // suppresses NDK 27's cmake_minimum_required(VERSION 3.6.0) warning under CMake >= 3.27 (Pitfall 4).
                arguments "-DANDROID_STL=c++_static", "-Wno-deprecated"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            // Keep in sync: flake.nix SDK cmake PATH, scripts/test_native_audio.sh fallback.
            version = "4.1.2"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // Prepare RNNoise pre-trained model weights from official upstream model archive
    task prepareRnnoiseModel {
        def versionFile = file('src/main/jni/rnnoise/model_version')
        def digestFile = file('model_sha256')
        def outputDir = file('src/main/jni/rnnoise-build/generated')
        def dataC = file('src/main/jni/rnnoise-build/generated/rnnoise_data.c')
        def dataH = file('src/main/jni/rnnoise-build/generated/rnnoise_data.h')
        def stampFile = file('src/main/jni/rnnoise-build/generated/.model_digest')
        def modelBin = file('src/main/assets/rnnoise_model.bin')
        def dumpScript = file('tools/dump_rnnoise_blob.py')
        inputs.file(versionFile).optional()
        inputs.file(digestFile)
        inputs.file(dumpScript).optional()
        outputs.file(dataC)
        outputs.file(dataH)
        outputs.file(stampFile)
        outputs.file(modelBin)

        doLast {
            // M11: expected digest first so every path below (including the
            // steady-state skip) is gated on it. Missing model_version falls
            // back to the vendored digest; no second hardcoded hash to rot.
            if (!digestFile.exists()) {
                throw new GradleException("RNNoise model_sha256 is missing; refusing to download unverified weights.")
            }
            def expectedDigest = digestFile.text.trim().toLowerCase()
            if (!expectedDigest.matches('[0-9a-f]{64}')) {
                throw new GradleException("RNNoise model_sha256 is malformed (expected 64 lowercase hex chars); refusing to download.")
            }
            def modelHash = versionFile.exists() ? versionFile.text.trim() : expectedDigest
            if (!modelHash.toLowerCase().equals(expectedDigest)) {
                throw new GradleException("RNNoise model version/digest drift: model_version (${modelHash}) does not match model_sha256 (${expectedDigest}); update both.")
            }
            // Steady-state skip: valid only when the stamp proves the outputs
            // were generated from this exact digest. Existence alone is not
            // enough (a digest rotation must regenerate), and the tarball
            // name rotates with the digest so its absence proves nothing.
            if (dataC.exists() && dataH.exists() && modelBin.exists()
                    && stampFile.exists() && stampFile.text.trim().toLowerCase().equals(expectedDigest)) {
                return
            }
            def cacheDir = file("${project.buildDir}/model_cache")
            cacheDir.mkdirs()
            def tarGz = file("${cacheDir}/rnnoise_data-${modelHash}.tar.gz")
            if (!tarGz.exists()) {
                println "Downloading RNNoise model weights (${modelHash.substring(0, 7)})..."
                def modelUrl = new URL("https://media.xiph.org/rnnoise/models/rnnoise_data-${modelHash}.tar.gz")
                modelUrl.withInputStream { ins ->
                    tarGz.withOutputStream { outs -> outs << ins }
                }
            }
            // M11: verify the whole tarball against the vendored digest
            // before unpacking. Fail closed on mismatch; no fallback URL.
            def md = java.security.MessageDigest.getInstance("SHA-256")
            tarGz.withInputStream { ins ->
                byte[] buf = new byte[8192]
                int n
                while ((n = ins.read(buf)) != -1) {
                    md.update(buf, 0, n)
                }
            }
            def actualDigest = md.digest().encodeHex().toString().toLowerCase()
            if (!actualDigest.equals(expectedDigest)) {
                def deleted = tarGz.delete()
                def cleanup = deleted ? "Deleted corrupt archive" : "Failed to delete corrupt archive at ${tarGz.absolutePath}; remove it manually"
                throw new GradleException("RNNoise model digest mismatch for ${tarGz.name}: expected ${expectedDigest}, got ${actualDigest}. ${cleanup}; re-run the build to re-download.")
            }
            outputDir.mkdirs()
            copy {
                from tarTree(tarGz)
                into outputDir
                include 'src/rnnoise_data.c', 'src/rnnoise_data.h'
                eachFile { fcd ->
                    fcd.path = fcd.name
                }
                includeEmptyDirs = false
            }

            // Dump 8-bit quantized binary model asset. Gradle 9 removed both
            // Task.exec and Project.exec; ProviderFactory.exec queried here, at
            // execution time, is the supported replacement (non-zero exit
            // throws, same fail-closed semantics).
            modelBin.parentFile.mkdirs()
            project.providers.exec {
                commandLine 'python3', dumpScript.absolutePath, dataC.absolutePath, modelBin.absolutePath
            }.result.get().assertNormalExitValue()
            stampFile.text = expectedDigest + '\n'
        }
    }
    preBuild.dependsOn prepareRnnoiseModel

    lint {
        abortOnError = true
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
}

tasks.matching { it.name.startsWith("configureCMake") }.configureEach {
    dependsOn(tasks.named("prepareRnnoiseModel"))
}

task testNativeAudioEngine(type: Exec) {
    description = 'Compiles and runs native C++ audio engine unit tests on the host'
    group = 'verification'
    workingDir "${project.rootDir}"
    commandLine "${project.rootDir}/scripts/test_native_audio.sh"
}

tasks.matching { it.name == "check" }.configureEach {
    dependsOn testNativeAudioEngine
}

// AGP's externalNativeBuild.cmake wires buildCMake* directly into
// merge*NativeLibs via task-output edges, so no startParameter regex gate or
// taskGraph.whenReady guard is needed. Unit-test tasks stay out of the CMake
// graph via those edges (verified by --dry-run; re-validate after AGP
// upgrades); packaging tasks get native libs automatically.

// NOTE: Test tasks deliberately do NOT depend on testNativeAudioEngine.
// That edge re-ran the full native rebuild (~50s cold-cache, and never
// up-to-date at the Gradle level since the Exec task declares no
// inputs/outputs) on every unit-test invocation, duplicating scripts/check.sh
// step 2b which already runs the same suite explicitly. `./gradlew check`
// still covers native via the check dependency above.
tasks.withType(Test).configureEach {
    systemProperty "java.library.path", "${project.rootDir}/build/test-native"
}
