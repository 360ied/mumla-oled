import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}
apply plugin: 'com.android.library'

repositories {
    mavenCentral()
    google()
}

dependencies {
    api 'com.google.protobuf:protobuf-java:4.35.1'
    api 'com.madgag.spongycastle:core:1.51.0.0'

    // Custom PKCS12 keybag parse modifications to support Mumble unencrypted certificates
    // Source: https://github.com/Morlunk/spongycastle/tree/pkcs12-keybag-fixes
    api files('libs/humla-spongycastle/prov/build/libs/prov-1.51.0.0.jar',
              'libs/humla-spongycastle/pkix/build/libs/pkix-1.51.0.0.jar')

    implementation 'com.googlecode.javacpp:javacpp:0.7'
    implementation 'org.jetbrains:annotations:18.0.0'
    implementation 'org.minidns:minidns-hla:0.3.4'
    implementation 'org.minidns:minidns-android21:0.3.4'
    testImplementation 'junit:junit:4.13.2'
}

allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
    }
}

android {
    namespace = 'se.lublin.humla'

    compileSdk = 36
    ndkVersion = '25.1.8937393'
    //buildToolsVersion '29.0.3'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets.main.jniLibs.srcDir 'src/main/libs/'
    sourceSets.main.jni.srcDirs = [] // Disable NDK build support until it supports multiple modules.

    // Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        testApplicationId "se.lublin.humla.test"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        minSdkVersion 21
        targetSdk 36

//        ndk {
//            abiFilters "armeabi", "armeabi-v7a", "x86"
//            stl "gnustl_static"
//            cFlags "-I\$(LOCAL_PATH)/speex/include/ -I\$(LOCAL_PATH)/celt-0.11.0-src/include/ -I\$(LOCAL_PATH)/celt-0.7.0-src/include/ -I\$(LOCAL_PATH)/opus/include -D__EMX__ -DUSE_KISS_FFT -DFIXED_POINT -DEXPORT='' -DHAVE_CONFIG_H -fvisibility=hidden -DOPUS_BUILD -DVAR_ARRAYS -Wno-traditional -DFIXED_POINT"
//        }
    }

    // Build custom Spongy Castle JARs from submodule if needed
    task buildSpongycastle(type: GradleBuild) {
        def provJar = file('libs/humla-spongycastle/prov/build/libs/prov-1.51.0.0.jar')
        def pkixJar = file('libs/humla-spongycastle/pkix/build/libs/pkix-1.51.0.0.jar')
        onlyIf { !provJar.exists() || !pkixJar.exists() }
        buildFile = file('libs/humla-spongycastle/build.gradle')
        dir = file('libs/humla-spongycastle')
        tasks = ['jar']
    }
    preBuild.dependsOn buildSpongycastle

    // Prepare RNNoise pre-trained model weights from official upstream model archive
    task prepareRnnoiseModel {
        def versionFile = file('src/main/jni/rnnoise/model_version')
        def outputDir = file('src/main/jni/rnnoise-build/generated')
        def dataC = file('src/main/jni/rnnoise-build/generated/rnnoise_data.c')
        def dataH = file('src/main/jni/rnnoise-build/generated/rnnoise_data.h')

        inputs.file(versionFile).optional()
        outputs.file(dataC)
        outputs.file(dataH)

        doLast {
            if (dataC.exists() && dataH.exists()) {
                return
            }
            def modelHash = versionFile.exists() ? versionFile.text.trim() : '5e7841199cf2947fc32f6eeaf6faffab5c2dd3da69e6a6e4830625a10285a09d'
            def cacheDir = file("${project.buildDir}/model_cache")
            cacheDir.mkdirs()
            def tarGz = file("${cacheDir}/rnnoise_data-${modelHash}.tar.gz")
            if (!tarGz.exists()) {
                println "Downloading RNNoise model weights (${modelHash.substring(0, 7)})..."
                def modelUrl = new URL("https://media.xiph.org/rnnoise/models/rnnoise_data-${modelHash}.tar.gz")
                modelUrl.withInputStream { ins ->
                    tarGz.withOutputStream { outs -> outs << ins }
                }
            }
            outputDir.mkdirs()
            copy {
                from tarTree(tarGz)
                into outputDir
                include 'src/rnnoise_data.c', 'src/rnnoise_data.h'
                eachFile { fcd ->
                    fcd.path = fcd.name
                }
                includeEmptyDirs = false
            }
            // Strip redundant 32-bit float tables for 8-bit quantized operation
            def cText = dataC.text
            def floatTables = [
                'conv2_weights_float',
                'gru1_input_weights_float',
                'gru1_recurrent_weights_float',
                'gru2_input_weights_float',
                'gru2_recurrent_weights_float',
                'gru3_input_weights_float',
                'gru3_recurrent_weights_float'
            ]
            for (String tbl : floatTables) {
                cText = cText.replaceAll(/(?s)#define WEIGHTS_${tbl}_DEFINED\n#define WEIGHTS_${tbl}_TYPE WEIGHT_TYPE_float\nstatic const float ${tbl}\[\d+\] = \{.*?\};\n/, '')
            }
            dataC.text = cText
        }
    }
    preBuild.dependsOn prepareRnnoiseModel

    // Trigger NDK build on java compilation task with full core parallelism and incremental tracking.
    task ndkBuild(type: Exec) {
        dependsOn prepareRnnoiseModel
        inputs.dir file('src/main/jni')
        outputs.dir file('src/main/libs')
        def ndkExe = "$project.android.ndkDirectory/ndk-build"
        if (DefaultNativePlatform.getCurrentOperatingSystem().isWindows()) {
          ndkExe += '.cmd'
        }
        def jobs = Runtime.runtime.availableProcessors()
        commandLine ndkExe, "-j${jobs}", '-C', file('src/main/jni/').absolutePath
    }

    preBuild.dependsOn ndkBuild


    tasks.withType(JavaCompile) {
        compileTask -> compileTask.dependsOn ndkBuild
    }

    lint {
        abortOnError = true
        // InvalidPackage is spongycastle-related
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
}
